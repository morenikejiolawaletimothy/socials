<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: var(--space-6);
    background: var(--bg-page);
    font-family: var(--font-sans);
  }
  .card {
    max-width: 380px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: var(--space-6);
  }
  .avatar {
    width: 44px; height: 44px;
    border-radius: var(--radius-full);
    background: var(--primary-600);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-inverse);
    font-family: var(--font-display);
    font-weight: 700; font-size: 20px;
    margin-bottom: var(--space-4);
  }
  h3 {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 600; line-height: 1.25;
    color: var(--text-primary);
    margin: 0 0 var(--space-2);
  }
  p {
    font-size: 16px; line-height: 1.55;
    color: var(--text-secondary);
    margin: 0 0 var(--space-5);
  }
  .cta {
    font-family: var(--font-sans);
    font-size: 16px; font-weight: 500; line-height: 1;
    background: var(--primary-600); color: var(--text-inverse);
    border: none; border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-5); cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">b</div>
    <h3>Grow your socials</h3>
    <p>Strategy, content and community for brands that want to sound like themselves — not everyone else.</p>
    <button class="cta">Book a call</button>
  </div>
</body>
</html>
